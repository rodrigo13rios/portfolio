<header class="fixed top-0 left-0 w-full z-50 bg-surface/90 backdrop-blur border-b border-border">
  <nav class="max-w-5xl mx-auto flex items-center justify-between px-6 py-4">
    <a href="#hero" class="text-lg font-semibold text-text-primary">
      Rodrigo Rios
    </a>

    <!-- Links desktop -->
    <ul class="hidden md:flex items-center gap-8">
      @for (link of navLinks; track link.href) {
        <li>
          <a
            [href]="link.href"
            class="text-sm text-text-muted hover:text-text-primary transition-colors"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <!-- Botón hamburguesa mobile -->
    <button
      type="button"
      class="md:hidden text-text-primary"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Abrir menú de navegación"
    >
      @if (isMenuOpen()) {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      }
    </button>
  </nav>

  <!-- Menú mobile desplegable -->
  @if (isMenuOpen()) {
    <ul class="md:hidden flex flex-col gap-1 px-6 pb-4 border-t border-border">
      @for (link of navLinks; track link.href) {
        <li>
          <a
            [href]="link.href"
            (click)="closeMenu()"
            class="block py-3 text-sm text-text-muted hover:text-text-primary transition-colors"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  }
</header>
