<article
  (pointerenter)="onPointerEnter($event)"
  (pointerleave)="onPointerLeave()"
  class="bg-surface border border-border rounded-lg overflow-hidden flex flex-col transition duration-300 hover:-translate-y-1 hover:border-accent/50 hover:shadow-lg hover:shadow-black/40"
>
  <div class="relative aspect-video overflow-hidden">
    @for (image of project().images; track $index; let i = $index) {
      <img
        [src]="image"
        [alt]="'Captura ' + (i + 1) + ' de ' + project().title"
        class="absolute inset-0 w-full h-full object-cover transition-opacity duration-500"
        [class.opacity-100]="i === currentIndex()"
        [class.opacity-0]="i !== currentIndex()"
      />
    }
  </div>

  <div class="p-5 flex flex-col flex-1">
    <h3 class="text-lg font-semibold text-text-primary">{{ project().title }}</h3>

    <p class="text-sm text-text-muted mt-2 leading-relaxed flex-1">
      {{ project().description }}
    </p>

    <div class="flex flex-wrap gap-2 mt-4">
      @for (tech of project().techStack; track tech) {
        <span class="px-2.5 py-1 rounded-md bg-background border border-border text-xs text-text-muted">
          {{ tech }}
        </span>
      }
    </div>

    <div class="flex gap-4 mt-5">
      @if (project().githubUrl) {
        <a
          [href]="project().githubUrl"
          target="_blank"
          rel="noopener"
          class="text-sm font-medium text-text-primary hover:text-accent transition-colors"
        >
          GitHub →
        </a>
      }
      @if (project().liveUrl) {
        <a
          [href]="project().liveUrl"
          target="_blank"
          rel="noopener"
          class="text-sm font-medium text-text-primary hover:text-accent transition-colors"
        >
          Ver demo →
        </a>
      }
    </div>
  </div>
</article>
