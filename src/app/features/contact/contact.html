<div class="max-w-3xl mx-auto px-6 py-20 text-center">
  <p class="text-accent text-sm font-medium mb-2">Contacto</p>
  <h2 class="text-3xl font-bold text-text-primary tracking-tight mb-4">
    ¿Hablamos?
  </h2>
  <p class="text-text-muted max-w-md mx-auto leading-relaxed mb-10">
    Estoy buscando oportunidades como desarrollador backend. Podés contactarme por cualquiera de estos medios.
  </p>

  <div class="flex flex-col sm:flex-row gap-4 justify-center">
    @for (link of links; track link.platform) {
      <a
        [href]="link.url"
        target="_blank"
        rel="noopener"
        class="px-6 py-3 rounded-lg border border-border text-text-primary font-medium text-sm hover:bg-surface transition-colors"
      >
        {{ link.platform }}
      </a>
    }
  </div>
</div>
